---
version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  commit-message:
    prefix: deps
  rebase-strategy: auto
  ignore:
  - dependency-name: brace-expansion
    update-types:
    - version-update:semver-major
  - dependency-name: "*"
    update-types:
    - version-update:semver-major
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  commit-message:
    prefix: actions
  rebase-strategy: auto
  ignore:
  - dependency-name: "*"
    update-types:
    - version-update:semver-major
