# Only dependency-only patch/minor updates are merged after exact-commit checks succeed.

name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge-after-build:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Read Dependabot update metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restrict automatic merges to patch and minor updates
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) ;;
            *) echo "This update requires manual review."; exit 1 ;;
          esac

      - name: Checkout trusted base safety checks
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify dependency-only changes and reject regressions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --test .github/scripts/check-dependency-update.test.cjs
          node .github/scripts/check-dependency-update.cjs "$BASE_SHA" "$HEAD_SHA"

      - name: Wait for successful build
        shell: bash
        run: |
          for attempt in {1..120}; do
            check="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" \
                --jq '([.check_runs[] | select(.name == "build")] | sort_by(.started_at) | last) // {}'
            )"

            status="$(jq -r '.status // "missing"' <<< "$check")"
            conclusion="$(jq -r '.conclusion // ""' <<< "$check")"

            echo "Build check status: $status${conclusion:+ ($conclusion)}"

            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
              exit 0
            fi

            if [[ "$status" == "completed" ]]; then
              echo "The build check did not succeed; leaving the pull request open."
              exit 1
            fi

            sleep 15
          done

          echo "Timed out waiting for the build check; leaving the pull request open."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Merge tested commit and delete branch
        shell: bash
        run: |
          current_base="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_base" != "$BASE_SHA" ]]; then
            echo "Main changed after this update was checked; wait for a rebase and new CI."
            exit 1
          fi
          for attempt in {1..5}; do
            echo "Merge attempt $attempt of 5"
            if gh pr merge \
              --squash \
              --delete-branch \
              --match-head-commit "$HEAD_SHA" \
              "$PR_URL"; then
              exit 0
            fi

            state="$(gh pr view "$PR_URL" --json state --jq '.state' 2>/dev/null || true)"
            if [[ "$state" == "MERGED" ]]; then
              echo "The pull request was merged by another workflow run."
              exit 0
            fi

            sleep $((attempt * 15))
          done

          echo "GitHub rejected all merge attempts; leaving the tested pull request open."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
