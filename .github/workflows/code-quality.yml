name: Code Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

        with:
          fetch-depth: 0

      - name: Enforce Change Safety
        run: node scripts/check-change-safety.cjs
        env:
          CHANGE_SAFETY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Tests If Present
        run: npm run test --if-present

      - name: Verify Packaging Dependencies
        run: node scripts/check-packaging-dependencies.cjs

      - name: Build Project
        run: |
          BUILD_COMMAND="$(node -e "const p = require('./package.json'); const s = p.scripts || {}; const deps = { ...(p.dependencies || {}), ...(p.devDependencies || {}) }; if (s['build:web']) console.log('npm run build:web'); else if (deps.vite) console.log('npx vite build'); else if (s.build) console.log('npm run build');")"
          if [ -n "$BUILD_COMMAND" ]; then
            $BUILD_COMMAND
          else
            echo "No build command configured; skipping build."
          fi
